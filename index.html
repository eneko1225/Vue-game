<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <title>Monster Slayer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://unpkg.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Jost:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <script src="https://unpkg.com/vue@3.5.45/dist/vue.global.prod.js" defer></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#game">Skip to Game</a>
    <header>
      <h1 translate="no">Monster Slayer</h1>
    </header>
    <main id="game" v-cloak>
      <section id="monster" class="container">
        <h2 id="monster-health-label">Monster Health</h2>
        <span class="health-value">{{monsterHealthValue}}</span>
        <div
          class="healthbar"
          role="progressbar"
          aria-labelledby="monster-health-label"
          aria-valuemin="0"
          :aria-valuemax="monsterTotalHealth"
          :aria-valuenow="monsterHealthValue"
        >
          <div class="healthbar__value" :style="monsterLifeStyle"></div>
        </div>
      </section>
      <section id="player" class="container">
        <h2 id="player-health-label">Your Health</h2>
        <span class="health-value">{{playerHealthValue}}</span>
        <div
          class="healthbar"
          role="progressbar"
          aria-labelledby="player-health-label"
          aria-valuemin="0"
          aria-valuemax="100"
          :aria-valuenow="playerHealthValue"
        >
          <div class="healthbar__value" :style="playerLifeStyle"></div>
        </div>
      </section>
      <div aria-live="polite">
        <section class="container" v-if="winner">
          <h2>Game Over!</h2>
          <h3 v-if="winner === 'player'">You won!</h3>
          <h3 v-else>You lose!</h3>
          <button type="button" @click="startNewGame">Start New Game</button>
        </section>
      </div>
      <section id="controls" aria-label="Actions">
        <button type="button" @click="attackMonster">Attack</button>
        <button type="button" :disabled="useSpecialAttack" @click="specialAttackMonster">Special Attack</button>
        <button type="button" @click="healPlayer">Heal</button>
        <button type="button" @click="surrenderPlayer">Surrender</button>
      </section>
      <section id="log" class="container">
        <h2 id="log-label">Battle Log</h2>
        <ul role="log" aria-labelledby="log-label">
          <li v-for="(logMessage, index) in log" :key="index">{{logMessage}}</li>
        </ul>
      </section>
    </main>
  </body>
</html>
